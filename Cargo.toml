[workspace]
resolver = "3"
members = [
    "crates/fmt",
    "crates/reqlog",
    "crates/s3raw",
    "crates/sonde-core",
    "crates/probes",
    "crates/decoders",
    "crates/sonde-nsh",
    "crates/proxy",
    "crates/analysis",
    "crates/sonde-cli",
]
default-members = [
    "crates/fmt",
    "crates/reqlog",
    "crates/s3raw",
    "crates/sonde-core",
    "crates/probes",
    "crates/decoders",
    "crates/proxy",
    "crates/analysis",
    "crates/sonde-cli",
]

[workspace.package]
version = "27.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hxddh/sonde"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
# Errors carry request ids, the raw body and the record id on purpose.
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
sonde-fmt = { path = "crates/fmt" }
reqlog = { path = "crates/reqlog" }
s3raw = { path = "crates/s3raw" }
sonde-core = { path = "crates/sonde-core" }
probes = { path = "crates/probes" }
decoders = { path = "crates/decoders" }
sonde-nsh = { path = "crates/sonde-nsh" }
sonde-proxy = { path = "crates/proxy" }
sonde-analysis = { path = "crates/analysis" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json", "query"] }
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
percent-encoding = "2"
quick-xml = { version = "0.42", features = ["serialize"] }
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
hex = "0.4"
base64 = "0.23"
crc32fast = "1"
crc32c = "0.6"
crc64fast-nvme = "1"
dirs = "7"
parking_lot = "0.12"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
# one compressor whatever else is built: Native Shell's tree turns zlib-rs on, a
# crate alone would get miniz_oxide (and write run files byte-different)
flate2 = { version = "1", features = ["zlib-rs"] }
apache-avro = { version = "0.23", default-features = false }
async-trait = "0.1"
tempfile = "3"

# Native Shell, pinned to one commit of longbridge/nsh (docs/dev/decisions.md D-207): its tag
# v0.6.1 (2f51d86). The one place for the pin: CI reads nsh-core's (.github/actions/nsh).
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "2f51d8611677c8a6bbad937b39756e8d0cc45350" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "2f51d8611677c8a6bbad937b39756e8d0cc45350" }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "2f51d8611677c8a6bbad937b39756e8d0cc45350" }
nsh-platform-tui = { git = "https://github.com/longbridge/nsh", rev = "2f51d8611677c8a6bbad937b39756e8d0cc45350" }
nsh-tui-host = { git = "https://github.com/longbridge/nsh", rev = "2f51d8611677c8a6bbad937b39756e8d0cc45350" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

# Keep debug builds small: dependencies (Native Shell, QuickJS) carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
