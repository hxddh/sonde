[workspace]
resolver = "3"
members = [
    "crates/fmt",
    "crates/reqlog",
    "crates/s3raw",
    "crates/sonde-core",
    "crates/probes",
    "crates/decoders",
    "crates/sonde-nsh",
    "crates/proxy",
    "crates/sonde-cli",
]
default-members = [
    "crates/fmt",
    "crates/reqlog",
    "crates/s3raw",
    "crates/sonde-core",
    "crates/probes",
    "crates/decoders",
    "crates/proxy",
    "crates/sonde-cli",
]

[workspace.package]
version = "17.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hxddh/sonde"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
# Errors carry request ids, the raw body and the record id on purpose.
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
sonde-fmt = { path = "crates/fmt" }
reqlog = { path = "crates/reqlog" }
s3raw = { path = "crates/s3raw" }
sonde-core = { path = "crates/sonde-core" }
probes = { path = "crates/probes" }
decoders = { path = "crates/decoders" }
sonde-nsh = { path = "crates/sonde-nsh" }
sonde-proxy = { path = "crates/proxy" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream", "http2", "json"] }
http = "1"
url = "2"
percent-encoding = "2"
quick-xml = { version = "0.41", features = ["serialize"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.11"
hex = "0.4"
base64 = "0.22"
crc32fast = "1"
crc32c = "0.6"
crc64fast-nvme = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
parking_lot = "0.12"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
flate2 = "1"
apache-avro = { version = "0.17", default-features = false }
flatbuffers = "24"
async-trait = "0.1"
tempfile = "3"

# Native Shell, pinned to one commit of longbridge/nsh (see docs/decisions.md D-002):
# the tag v0.5.0.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
nsh-platform-tui = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

# Keep debug builds small: dependencies (Native Shell, QuickJS) carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
