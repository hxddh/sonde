# S3 implementations for sonde's integration tests (scripts/integration.sh).
services:
  minio:
    # built from source (minio/Dockerfile): no MinIO image may be pulled
    build: minio
    image: sonde-minio
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: sondeminio
      MINIO_ROOT_PASSWORD: sondeminio-secret
    ports: ["9000:9000"]
    profiles: ["minio", "all"]
  ceph:
    image: quay.io/ceph/demo:latest-squid
    command: demo
    environment:
      MON_IP: 172.31.0.10
      CEPH_PUBLIC_NETWORK: 172.31.0.0/24
      CEPH_DEMO_UID: sonde
      CEPH_DEMO_ACCESS_KEY: sondeaccess
      CEPH_DEMO_SECRET_KEY: sondesecret
      RGW_FRONTEND_PORT: "7480"
      DEMO_DAEMONS: mon,mgr,osd,rgw
      # the monitor refuses to start under 5% free disk; a test cluster needs little
      CEPH_ARGS: "--mon_data_avail_crit=1"
    networks:
      s3:
        ipv4_address: 172.31.0.10
    ports: ["7480:7480"]
    profiles: ["ceph", "all"]
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9100"
    ports: ["9100:9100"]
    profiles: ["rustfs", "all"]

networks:
  s3:
    ipam:
      config:
        - subnet: 172.31.0.0/24
