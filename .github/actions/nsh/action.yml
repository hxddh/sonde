name: Native Shell CLI
description: Installs the nsh CLI at a pinned commit (cached), and the TypeScript compiler nsh check uses.
inputs:
  rev:
    description: longbridge/nsh commit
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ~/.cargo/bin/nsh
        key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rev }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --force --locked --git https://github.com/longbridge/nsh --rev ${{ inputs.rev }} nsh-cli
    - shell: bash
      run: nsh --version
