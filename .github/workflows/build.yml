name: Build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      # pr: Linux x86_64; all: every file a release ships (main's runs, the
      # nightly, by hand: release.yml publishes what main's run built)
      set:
        type: string
        default: all
    # signing (docs/dev/packaging.md): each step that needs one is skipped, and
    # says so, while it is not set
    secrets:
      MACOS_CERTIFICATE_P12: { required: false }
      MACOS_CERTIFICATE_PASSWORD: { required: false }
      MACOS_SIGNING_IDENTITY: { required: false }
      APPLE_API_KEY: { required: false }
      APPLE_API_KEY_ID: { required: false }
      APPLE_API_ISSUER: { required: false }
      AZURE_TENANT_ID: { required: false }
      AZURE_CLIENT_ID: { required: false }
      AZURE_CLIENT_SECRET: { required: false }
      AZURE_SIGNING_ENDPOINT: { required: false }
      AZURE_SIGNING_ACCOUNT: { required: false }
      AZURE_SIGNING_PROFILE: { required: false }

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      terminal: ${{ steps.plan.outputs.terminal }}
      desktop: ${{ steps.plan.outputs.desktop }}
      macos-app: ${{ steps.plan.outputs.macos-app }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - id: plan
        shell: python
        env:
          SET: ${{ inputs.set }}
        run: |
          import json, os
          level = {"pr": 0, "all": 1}[os.environ["SET"]]
          terminal = [
              (0, "ubuntu-22.04", "x86_64-unknown-linux-gnu", "linux-x86_64"),
              # static: runs on any Linux, Alpine and distroless included
              (0, "ubuntu-22.04", "x86_64-unknown-linux-musl", "linux-x86_64-musl"),
              (1, "ubuntu-22.04-arm", "aarch64-unknown-linux-gnu", "linux-aarch64"),
              (1, "macos-15", "aarch64-apple-darwin", "macos-aarch64"),
              (1, "macos-15-intel", "x86_64-apple-darwin", "macos-x86_64"),
              # sonde.exe in a .zip: CI on Windows, and the terminal there
              (1, "windows-latest", "x86_64-pc-windows-msvc", "windows-x86_64"),
          ]
          desktop = [
              (0, "ubuntu-24.04", "linux", "linux-x86_64"),
              (1, "windows-latest", "windows", "windows-x86_64"),
          ]
          t = [{"os": o, "target": g, "name": n} for l, o, g, n in terminal if l <= level]
          d = [{"os": o, "target": g, "name": n} for l, o, g, n in desktop if l <= level]
          m = level >= 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"terminal={json.dumps(t)}\ndesktop={json.dumps(d)}\n")
              out.write(f"macos-app={str(m).lower()}\nany={str(bool(t or d or m)).lower()}\n")
          print("terminal:", [x["name"] for x in t], "desktop:", [x["name"] for x in d], "macos-app:", m)

  viewer:
    # the page `sonde share` writes: Native Shell's web target, made once
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: rust
        with: { targets: wasm32-unknown-unknown }
      - uses: ./.github/actions/nsh
        id: nsh
      - run: sudo apt-get update -q && sudo apt-get install -y -q llvm
      # what takes long is Native Shell's web runtime, which an installed nsh
      # does not carry: built in a checkout of the pinned commit, and kept
      # while that commit and Rust are the same (NSH_RUNTIME points nsh at it)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: runtime
        with:
          path: ${{ runner.temp }}/nsh-runtime
          key: nsh-web-${{ steps.nsh.outputs.rev }}-${{ steps.rust.outputs.cachekey }}
      - name: Native Shell's web runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          NSH_REV: ${{ steps.nsh.outputs.rev }}
        run: |
          git init -q "$RUNNER_TEMP/nsh" && cd "$RUNNER_TEMP/nsh"
          git fetch -q --depth 1 https://github.com/longbridge/nsh "$NSH_REV" && git checkout -q FETCH_HEAD
          # the installed nsh is this commit's nsh-cli: in the checkout's
          # target/release it builds the web runtime from the checkout
          nsh="$RUNNER_TEMP/nsh/target/release/nsh"
          mkdir -p "$(dirname "$nsh")" && cp "$(command -v nsh)" "$nsh"
          (cd "$GITHUB_WORKSPACE/viewer" && "$nsh" package App.tsx --target web)
          web="$RUNNER_TEMP/nsh/target/wasm32-unknown-unknown/web"
          mkdir -p "$RUNNER_TEMP/nsh-runtime/web"
          cp "$web/nsh-browser.wasm" "$web/nsh-syntaxes.bin" crates/nsh-platform-web/web/nsh.js "$RUNNER_TEMP/nsh-runtime/web/"
          # the runtime's browser modules (nsh.js imports them): without them the page starts nothing
          cp -r crates/nsh-platform-web/web/browser "$RUNNER_TEMP/nsh-runtime/web/"
      - name: Build the viewer
        env:
          NSH_RUNTIME: ${{ runner.temp }}/nsh-runtime
        run: |
          cd viewer && nsh package App.tsx --target web
          ls -la .nsh/out/sonde-viewer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonde-viewer
          path: viewer/.nsh/out/sonde-viewer

  bundle:
    # the app's bundle the terminal binary embeds (`sonde tui`): JavaScript,
    # the same for every platform, built once (a terminal build then needs
    # no Native Shell of its own)
    needs: plan
    if: needs.plan.outputs.terminal != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # the app's crate, as ci.yml's ui job keeps it (which saves it)
      - run: mkdir -p app/.nsh/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: app, save-if: false, workspaces: ". -> target\napp/.nsh/rust -> ../../target" }
      - uses: ./.github/actions/nsh
      - name: Bundle the app
        run: cd app && nsh build App.tsx --release && ls -la .nsh/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonde-bundle
          path: app/.nsh/out

  terminal:
    needs: [plan, viewer, bundle]
    if: needs.plan.outputs.terminal != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.terminal) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", key: "${{ matrix.target }}" }
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: sonde-bundle, path: app/.nsh/out }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: sonde-viewer, path: viewer/.nsh/out/sonde-viewer }
      - name: Build sonde (CLI + TUI)
        run: cargo build --release --locked -p sonde-cli --features tui --target ${{ matrix.target }}
      - name: Check the binary needs no GUI libraries
        if: runner.os == 'Linux'
        run: |
          # a static binary has no dynamic libraries to list
          (ldd target/${{ matrix.target }}/release/sonde || true) | tee ldd.txt
          if grep -Ei "gtk|gdk|glib|cairo|pango|webkit|x11|wayland" ldd.txt; then echo "::error::the terminal binary links GUI libraries"; exit 1; fi
          image=${{ contains(matrix.target, 'musl') && 'alpine:3.20' || 'debian:bookworm-slim' }}
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release/sonde:/sonde:ro" $image /sonde --version
      - name: Check the binary on macOS
        if: runner.os == 'macOS'
        run: otool -L target/${{ matrix.target }}/release/sonde
      - name: Check the binary on Windows
        if: runner.os == 'Windows'
        run: target/${{ matrix.target }}/release/sonde.exe --version
      - name: sonde share has its viewer
        run: target/${{ matrix.target }}/release/sonde share crates/proxy/tests/fixtures/delta.sonde -o share-check.html && grep -q 'id="sonde-files"' share-check.html
      # before it is zipped: the archive holds the signed sonde.exe
      - name: Sign sonde.exe (skipped without the signing secrets)
        if: runner.os == 'Windows'
        uses: ./.github/actions/sign-windows
        with:
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\sonde.exe
          release: ${{ inputs.release }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          account: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ secrets.AZURE_SIGNING_PROFILE }}
      - name: Package
        run: |
          mkdir -p dist
          name=sonde-${{ matrix.name }}
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/sonde.exe dist/sonde.exe
            (cd dist && 7z a -tzip -bso0 $name.zip sonde.exe)
            # "<sha>  <file>", as shasum writes it elsewhere (no "*" of binary mode)
            (cd dist && echo "$(sha256sum < $name.zip | cut -d' ' -f1)  $name.zip" > $name.zip.sha256)
          else
            cp target/${{ matrix.target }}/release/sonde dist/sonde
            tar -C dist -czf dist/$name.tar.gz sonde
            (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
          fi
          cat dist/$name.*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonde-${{ matrix.name }}
          path: |
            dist/sonde-${{ matrix.name }}.tar.gz*
            dist/sonde-${{ matrix.name }}.zip*

  desktop:
    # the app on Linux (GTK 4) and Windows (Win32), as Native Shell packages it
    needs: [plan, viewer]
    if: needs.plan.outputs.desktop != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", key: "desktop-${{ matrix.target }}" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang
      - uses: ./.github/actions/nsh
      # the app's Share writes the session as the viewer's web page
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: sonde-viewer, path: viewer/.nsh/out/sonde-viewer }
      - name: Package the app
        run: cd app && nsh package App.tsx --target ${{ matrix.target }}
      - name: Sign the app (skipped without the signing secrets)
        if: runner.os == 'Windows'
        uses: ./.github/actions/sign-windows
        with:
          files: ${{ github.workspace }}\app\.nsh\out\sonde\sonde.exe
          release: ${{ inputs.release }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          account: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ secrets.AZURE_SIGNING_PROFILE }}
      # nsh zipped the folder before it was signed: zipped again, its
      # entries under sonde/ as nsh writes them
      - name: The updater's archive, of the signed app
        if: runner.os == 'Windows'
        run: |
          shopt -s nullglob
          cd app/.nsh/out
          for z in sonde-[0-9]*-windows-*.zip; do rm "$z" && 7z a -tzip -bso0 "$z" sonde; done
      - name: Collect the archive (sonde-<version>-<platform>, as the updater names it)
        run: |
          shopt -s nullglob
          mkdir -p dist
          ls -la app/.nsh/out
          cp app/.nsh/out/sonde-[0-9]*-*.* dist/
          (cd dist && for f in sonde-[0-9]*; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonde-desktop-${{ matrix.name }}
          path: dist/sonde-[0-9]*

  macos-app:
    needs: [plan, viewer]
    if: needs.plan.outputs.macos-app == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: macos-app, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: ./.github/actions/nsh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: sonde-viewer, path: viewer/.nsh/out/sonde-viewer }
      - name: Package the .app
        run: nsh package app/App.tsx --target macos --out dist
      - name: Sign with Developer ID, inside out (skipped without the certificate)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          # a release without it says so as a warning on the run, not a notice
          SONDE_RELEASE: ${{ inputs.release }}
        run: scripts/macos-sign.sh dist/sonde.app
      - name: Notarize and staple the .app (skipped without the API key)
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SONDE_RELEASE: ${{ inputs.release }}
        run: scripts/macos-notarize.sh dist/sonde.app
      # nsh archived the app before it was signed: archived again, as nsh
      # does (tar keeps the links and modes the signature covers;
      # COPYFILE_DISABLE keeps out the ._ files it does not)
      - name: The updater's archive, of the stapled app
        run: |
          shopt -s nullglob
          cd dist
          for t in sonde-[0-9]*-macos-*.tar.gz; do COPYFILE_DISABLE=1 tar -czf "$t" sonde.app; done
      - name: Make the .dmg (signed with the certificate)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: scripts/macos-dmg.sh dist/sonde.app dist/sonde-macos.dmg
      - name: Notarize and staple the .dmg (skipped without the API key)
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SONDE_RELEASE: ${{ inputs.release }}
        run: scripts/macos-notarize.sh dist/sonde-macos.dmg
      - name: Checksums (the .dmg, and the archive the updater installs)
        run: |
          shopt -s nullglob
          ls -la dist
          cd dist && for f in sonde-macos.dmg sonde-[0-9]*-macos-*.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonde-macos-app
          path: |
            dist/sonde-macos.dmg*
            dist/sonde-[0-9]*-macos-*
