name: Release

on:
  push:
    tags: ["v*"]
  # releasing without pushing a tag: the release step creates the tag at the
  # dispatched commit
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (it must have a CHANGELOG.md section)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  reuse:
    # what CI built of this very commit (main's run, the nightly or one by
    # hand; never a pull request's), kept again as this run's artifacts, so
    # the build below makes only what is missing: usually the macOS app and
    # macOS Intel, nothing after a nightly or a CI run by hand on the commit
    runs-on: ubuntu-24.04
    outputs:
      have: ${{ steps.reuse.outputs.have }}
    steps:
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          want="sonde-linux-x86_64 sonde-linux-x86_64-musl sonde-linux-aarch64 sonde-macos-aarch64 sonde-macos-x86_64
            sonde-windows-x86_64 sonde-desktop-linux-x86_64 sonde-desktop-windows-x86_64 sonde-macos-app"
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&per_page=50" --jq \
            '.workflow_runs[] | select((.event == "push" or .event == "schedule" or .event == "workflow_dispatch") and .head_repository.full_name == env.REPO) | .id')
          have=()
          mkdir -p reused
          for id in $runs; do
            names=$(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .name')
            for n in $want; do
              case " ${have[*]} " in *" $n "*) continue;; esac
              grep -qx "$n" <<<"$names" || continue
              gh run download "$id" -R "$REPO" -n "$n" -D reused
              have+=("$n")
              echo "- \`$n\` from https://github.com/$REPO/actions/runs/$id" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          [ ${#have[@]} -gt 0 ] || echo "no CI run of $SHA kept a build: everything is built here" >> "$GITHUB_STEP_SUMMARY"
          echo "have=$(jq -cn '$ARGS.positional' --args ${have[@]+"${have[@]}"})" >> "$GITHUB_OUTPUT"
          ls -la reused
      - if: steps.reuse.outputs.have != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: reused, path: reused }

  build:
    needs: reuse
    uses: ./.github/workflows/build.yml
    with: { release: true, skip: "${{ needs.reuse.outputs.have }}" }
    secrets: inherit

  publish:
    needs: [reuse, build]
    if: ${{ !cancelled() && needs.reuse.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # build provenance: a Sigstore attestation of each file, made with this
      # workflow's identity and kept by GitHub (`gh attestation verify`)
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        run: |
          v="${VERSION#v}"
          grep -q "^version = \"$v\"" Cargo.toml || { echo "::error::Cargo.toml is not at $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # the binaries and the app (not the viewer's site, which is inside them)
        with: { path: dist, pattern: "sonde-[lmdw]*", merge-multiple: true }
      - if: needs.reuse.outputs.have != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: reused, path: dist }
      - name: Every platform, once
        run: |
          shopt -s nullglob
          cd dist && ls -la
          for f in sonde-{linux-x86_64,linux-x86_64-musl,linux-aarch64,macos-aarch64,macos-x86_64}.tar.gz sonde-windows-x86_64.zip \
            sonde-macos.dmg "sonde-$VERSION-linux-x86_64.tar.gz" "sonde-$VERSION-windows-x86_64.zip"; do
            [ -f "$f" ] && [ -f "$f.sha256" ] || { echo "::error::$f (or its .sha256) is missing"; exit 1; }
          done
          app=(sonde-"$VERSION"-macos-*.tar.gz)
          [ ${#app[@]} -gt 0 ] || { echo "::error::the macOS app's updater archive is missing"; exit 1; }
      - name: Checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$VERSION" > notes.md
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: ./.github/actions/nsh
        # (the tag v0.5.0)
        with: { rev: f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1 }
      # the app's code alone, signed: installed apps that trust the root run
      # it without a new app (skipped without the release key and its certificate)
      - name: Signed package of the app's code
        env:
          NSH_PACKAGE_KEY: ${{ secrets.NSH_PACKAGE_KEY }}
          NSH_PACKAGE_CERT: ${{ secrets.NSH_PACKAGE_CERT }}
        if: env.NSH_PACKAGE_KEY != '' && env.NSH_PACKAGE_CERT != ''
        run: |
          printf '%s' "$NSH_PACKAGE_KEY" > "$RUNNER_TEMP/release.secret"
          printf '%s' "$NSH_PACKAGE_CERT" > "$RUNNER_TEMP/release.cert"
          cd app && nsh publish --key "$RUNNER_TEMP/release.secret" --cert "$RUNNER_TEMP/release.cert" -o "../dist/sonde-$VERSION.nshpkg"
          rm -f "$RUNNER_TEMP/release.secret"
      - name: No signed package of the app's code
        env:
          NSH_PACKAGE_KEY: ${{ secrets.NSH_PACKAGE_KEY }}
          NSH_PACKAGE_CERT: ${{ secrets.NSH_PACKAGE_CERT }}
        if: env.NSH_PACKAGE_KEY == '' || env.NSH_PACKAGE_CERT == ''
        run: |
          echo "::warning title=Not signed::no NSH_PACKAGE_KEY and NSH_PACKAGE_CERT: this release has no signed .nshpkg, and installed apps update only by a new app"
      - name: The manifest the app's updater reads (latest.json)
        run: |
          shopt -s nullglob
          cd app
          pkg=(../dist/sonde-*.nshpkg)
          nsh update-manifest ../dist/sonde-[0-9]*.tar.gz ../dist/sonde-[0-9]*.zip \
            ${pkg:+--package "${pkg[0]}"} \
            --notes ../notes.md \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$VERSION" \
            -o ../dist
          cat ../dist/latest.json
      # who built each file, from which commit, by which workflow: install.sh
      # checks it when gh is there (`gh attestation verify <file> -R hxddh/sonde`)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.nshpkg
            dist/latest.json
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: sonde ${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/latest.json
            dist/*.nshpkg
            dist/*.sha256
            dist/SHA256SUMS
      - name: Update the Homebrew tap (skipped without HOMEBREW_TAP_TOKEN)
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/update-tap.sh "$VERSION" dist/SHA256SUMS

  # `uses: hxddh/sonde@v18` follows the newest 18.x
  action-tag:
    needs: publish
    uses: ./.github/workflows/action-tag.yml
    with: { version: "${{ inputs.version || github.ref_name }}" }
