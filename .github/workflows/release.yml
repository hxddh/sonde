name: Release

on:
  push:
    tags: ["v*"]
  # releasing without pushing a tag: the release step creates the tag at the
  # dispatched commit
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (it must have a CHANGELOG.md section)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  # Nothing is built here: CI's run of this very commit on main (its push,
  # the nightly or one by hand; never a pull request's) builds every file a
  # release ships, and runs the tours of every platform. The release waits
  # for that run, is refused unless it is green, and publishes its builds.
  publish:
    runs-on: ubuntu-24.04
    # CI's run (about an hour on main) and the publishing after it
    timeout-minutes: 150
    permissions:
      contents: write
      actions: read
      # build provenance: a Sigstore attestation of each file, made with this
      # workflow's identity and kept by GitHub (`gh attestation verify`)
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        run: |
          v="${VERSION#v}"
          grep -q "^version = \"$v\"" Cargo.toml || { echo "::error::Cargo.toml is not at $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: CI's green run of this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/release-wait.sh
      - name: Its builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.ci.outputs.run }}
        run: |
          for n in sonde-linux-x86_64 sonde-linux-x86_64-musl sonde-linux-aarch64 sonde-macos-aarch64 sonde-macos-x86_64 \
            sonde-windows-x86_64 sonde-desktop-linux-x86_64 sonde-desktop-windows-x86_64 sonde-macos-app; do
            gh run download "$RUN" -R "${{ github.repository }}" -n "$n" -D dist
          done
      - name: Every platform, once
        run: |
          shopt -s nullglob
          cd dist && ls -la
          for f in sonde-{linux-x86_64,linux-x86_64-musl,linux-aarch64,macos-aarch64,macos-x86_64}.tar.gz sonde-windows-x86_64.zip \
            sonde-macos.dmg "sonde-$VERSION-linux-x86_64.tar.gz" "sonde-$VERSION-windows-x86_64.zip"; do
            [ -f "$f" ] && [ -f "$f.sha256" ] || { echo "::error::$f (or its .sha256) is missing"; exit 1; }
          done
          app=(sonde-"$VERSION"-macos-*.tar.gz)
          [ ${#app[@]} -gt 0 ] || { echo "::error::the macOS app's updater archive is missing"; exit 1; }
      - name: Checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$VERSION" > notes.md
      # what the owner's secrets would add, said on the release page too
      - name: What this release skipped
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NSH_PACKAGE_KEY: ${{ secrets.NSH_PACKAGE_KEY }}
          NSH_PACKAGE_CERT: ${{ secrets.NSH_PACKAGE_CERT }}
        run: |
          skipped=()
          [ -n "$MACOS_CERTIFICATE_P12" ] || skipped+=("- The macOS app is not signed with a Developer ID: Gatekeeper refuses the \`.dmg\` until you right-click → Open, or run \`xattr -d com.apple.quarantine sonde.app\`.")
          [ -n "$APPLE_ID" ] || skipped+=("- The \`.dmg\` is not notarized.")
          [ -n "$NSH_PACKAGE_KEY" ] && [ -n "$NSH_PACKAGE_CERT" ] || skipped+=("- No signed package of the app's code: an installed app updates only by installing the new app.")
          # (no Windows signing yet: the release says so until there is)
          skipped+=("- \`sonde.exe\` and the Windows app are not signed (no Authenticode): SmartScreen warns before the first start; **More info → Run anyway**.")
          if [ ${#skipped[@]} -gt 0 ]; then
            { echo; echo "### Not in this release"; echo; printf '%s\n' "${skipped[@]}"; } >> notes.md
            printf '::warning title=Skipped::%s\n' "${skipped[@]}"
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: ./.github/actions/nsh
        # (its main at 2ca3b80: D-207)
        with: { rev: 2ca3b8005cf00907c8c501ad9ba5f21f576fee84 }
      # the app's code alone, signed: installed apps that trust the root run
      # it without a new app (skipped without the release key and its certificate)
      - name: Signed package of the app's code
        env:
          NSH_PACKAGE_KEY: ${{ secrets.NSH_PACKAGE_KEY }}
          NSH_PACKAGE_CERT: ${{ secrets.NSH_PACKAGE_CERT }}
        if: env.NSH_PACKAGE_KEY != '' && env.NSH_PACKAGE_CERT != ''
        run: |
          printf '%s' "$NSH_PACKAGE_KEY" > "$RUNNER_TEMP/release.secret"
          printf '%s' "$NSH_PACKAGE_CERT" > "$RUNNER_TEMP/release.cert"
          cd app && nsh publish --key "$RUNNER_TEMP/release.secret" --cert "$RUNNER_TEMP/release.cert" -o "../dist/sonde-$VERSION.nshpkg"
          rm -f "$RUNNER_TEMP/release.secret"
      - name: No signed package of the app's code
        env:
          NSH_PACKAGE_KEY: ${{ secrets.NSH_PACKAGE_KEY }}
          NSH_PACKAGE_CERT: ${{ secrets.NSH_PACKAGE_CERT }}
        if: env.NSH_PACKAGE_KEY == '' || env.NSH_PACKAGE_CERT == ''
        run: |
          echo "::warning title=Not signed::no NSH_PACKAGE_KEY and NSH_PACKAGE_CERT: this release has no signed .nshpkg, and installed apps update only by a new app"
      - name: The manifest the app's updater reads (latest.json)
        run: |
          shopt -s nullglob
          cd app
          pkg=(../dist/sonde-*.nshpkg)
          nsh update-manifest ../dist/sonde-[0-9]*.tar.gz ../dist/sonde-[0-9]*.zip \
            ${pkg:+--package "${pkg[0]}"} \
            --notes ../notes.md \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$VERSION" \
            -o ../dist
          cat ../dist/latest.json
      # who built each file, from which commit, by which workflow: install.sh
      # checks it when gh is there (`gh attestation verify <file> -R hxddh/sonde`)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.nshpkg
            dist/latest.json
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: sonde ${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/latest.json
            dist/*.nshpkg
            dist/*.sha256
            dist/SHA256SUMS

  # `uses: hxddh/sonde@v20` follows the newest 20.x
  action-tag:
    needs: publish
    uses: ./.github/workflows/action-tag.yml
    with: { version: "${{ inputs.version || github.ref_name }}" }

  # the Action as a user's workflow runs it, against the release just made
  # (a release made with this workflow's token starts no workflow of its own)
  action-live:
    needs: action-tag
    uses: ./.github/workflows/action-live.yml
    with: { after-release: true }
    permissions:
      contents: read
      actions: read
      attestations: read
      issues: write
