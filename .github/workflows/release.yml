name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with: { release: true }
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.dmg
            dist/SHA256SUMS
      - name: Update the Homebrew tap (skipped without HOMEBREW_TAP_TOKEN)
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/update-tap.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS
