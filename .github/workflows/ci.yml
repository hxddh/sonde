name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# a newer push supersedes the run before it
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Native Shell, pinned (docs/decisions.md D-002)
  NSH_REV: 1662115e30b4a86ca2e5eaf216e165c93bbdbee9

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/nsh
        with: { rev: "${{ env.NSH_REV }}" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p sonde-cli --features tui --all-targets -- -D warnings
      - run: cd app && nsh check
      - name: Tables fit where they are shown; every word in every language
        run: python3 scripts/lint-layout.py && python3 scripts/lint-kit.py && python3 scripts/check-locales.py
      - name: nsh build reports no warnings
        run: |
          cd app && nsh build App.tsx 2>&1 | tee build.log
          ! grep -E "^warn" build.log

  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\ntools/gen-slatedb -> target" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "pyiceberg[sql-sqlite,pyarrow]==0.9.1"
      - run: scripts/integration.sh ceph rustfs
      - if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --tail 200

  record:
    # sonde run with four AWS SDKs against RustFS, and the proxy's overhead
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version-file: tools/sdk-smoke/go/go.mod, cache-dependency-path: tools/sdk-smoke/go/go.sum }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: pip install boto3
      - name: Start RustFS
        run: |
          docker compose -f tests/integration/docker-compose.yml --profile rustfs up -d rustfs
          until curl -s -o /dev/null -m 2 http://127.0.0.1:9100; do sleep 2; done
      - run: cargo build -p sonde-cli
      - name: Four SDKs through sonde run
        env: { SMOKE_SESSIONS: sessions }
        run: scripts/sdk-smoke.sh --url http://127.0.0.1:9100
      - name: Proxy overhead
        env: { OVERHEAD_URL: "http://127.0.0.1:9100", OVERHEAD_BUCKET: sonde-smoke }
        run: cargo run --release -p sonde-proxy --example overhead
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: sdk-sessions, path: "sessions/*.sonde", if-no-files-found: ignore }

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\napp/.nsh/rust -> ../../target" }
      - uses: ./.github/actions/nsh
        with: { rev: "${{ env.NSH_REV }}" }
      - run: scripts/ui-tests.sh

  shots:
    # the app on a real window — GTK under Xvfb, AppKit, Win32: every place,
    # wide and at the least size, light and dark, English and Chinese — kept
    # as an artifact, the visual record of each build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15, name: macos }
          - { os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "shots-${{ matrix.name }}", workspaces: "app/.nsh/rust -> ../../target" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang xvfb openbox fonts-noto-cjk
      - uses: ./.github/actions/nsh
        with: { rev: "${{ env.NSH_REV }}" }
      - name: Screenshots
        # the macOS runner's screen is 1024×768 (a menu bar above): a larger
        # window is cut off, and system_profiler does not say so there
        env:
          SONDE_SHOT_MAX: ${{ runner.os == 'macOS' && '1024x688' || '' }}
        run: scripts/shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonde-shots-${{ matrix.name }}
          path: app/shots/*.png
          if-no-files-found: warn
      # what changed on screen since the last green run of this workflow, in
      # the job summary, with before | after | difference images to look at
      - name: Screens against the last green run
        if: success()
        # a report for a person, never a failure
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id' || true)
          if [ -z "$prev" ]; then echo "no green run to compare with"; exit 0; fi
          mkdir -p shots-before
          gh run download "$prev" -R "${{ github.repository }}" -n "sonde-shots-${{ matrix.name }}" -D shots-before || { echo "no screenshots in run $prev"; exit 0; }
          # a venv of its own: macOS's Python takes no packages system-wide (PEP 668)
          python3 -m venv "$RUNNER_TEMP/diff"
          py="$RUNNER_TEMP/diff/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/diff/Scripts/python"
          "$py" -m pip install -q pillow
          "$py" scripts/shots-diff.py shots-before app/shots shots-diff >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sonde-shots-diff-${{ matrix.name }}
          path: shots-diff/*.png
          if-no-files-found: ignore

  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
