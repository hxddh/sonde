name: CI

# One run per change: a pull request's, then main's once merged. Main's
# run, the nightly and one by hand do everything: every build a release
# ships (release.yml publishes main's) and the tours of Linux, macOS and
# Windows. A pull request's builds and tours Linux only. A Dependabot crate
# update runs lint, unit and supply.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# a newer push to a pull request cancels its run; main's runs all finish
# (a release takes its build from them)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Native Shell, pinned (docs/decisions.md D-002): the tag v0.5.0
  NSH_REV: f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: ./.github/actions/nsh
        with: { rev: "${{ env.NSH_REV }}" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p sonde-cli --features tui --all-targets -- -D warnings
      - run: cd app && nsh check
      - name: Tables fit where they are shown; every word in every language
        run: python3 scripts/lint-layout.py && python3 scripts/lint-kit.py && python3 scripts/check-locales.py && python3 scripts/lint-charts.py
      - name: nsh build reports no warnings
        run: |
          set -o pipefail
          cd app && nsh build App.tsx 2>&1 | tee build.log
          ! grep -E "^warn" build.log

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # a test that hangs fails the job, not the hours after it
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      # the default members: the CLI, the proxy and what is under them (the
      # app's bridge, sonde-nsh, is built by the lint, ui and shots jobs)
      - run: cargo test --workspace --locked

  budgets:
    # sessions of any size, held (optimised, as released): each test's
    # peak memory, the same from run to run, against its budget; its time,
    # which a shared runner moves, said and held only past several times
    # what it takes (crates/proxy/tests/budgets.rs, docs/performance.md).
    # Each test is a process of its own, so its peak is its own. A job of
    # its own beside the unit tests: its release build and its sessions of
    # a million take longer than they do.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", key: budgets }
      - name: Budgets of a large session
        run: |
          set -o pipefail
          # (listed first: a build that fails, or lists none, fails the step)
          tests=$(cargo test --release --locked -p sonde-proxy --test budgets -- --ignored --list --format terse | sed -n 's/: test$//p')
          [ -n "$tests" ] || { echo "::error title=Budgets::no budget test was listed"; exit 1; }
          for t in $tests; do
            cargo test --release --locked -p sonde-proxy --test budgets -- --ignored --nocapture --exact "$t" 2>&1 | tee -a budgets.log
          done
          { echo '```'; grep -h "^budget " budgets.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  supply:
    # what sonde is built from: the licences, advisories and sources of its
    # crates, and the Java hook it injects, rebuilt from source byte for byte
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-deny }
      - name: Licences, advisories, sources and bans (deny.toml)
        run: cargo deny --locked check
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "21" }
      - name: The committed callers hook is what hooks/java builds
        run: |
          sh hooks/java/build.sh
          git diff --exit-code --stat crates/proxy/src/hooks || {
            echo "::error title=Callers hook::crates/proxy/src/hooks/*.jar differ from what hooks/java/build.sh makes of hooks/java/src: run it and commit the jars"
            exit 1
          }

  action:
    # the GitHub Action (action.yml): its scripts linted and run against
    # stand-ins, then the action itself with this commit's sonde
    # (action-live.yml: against a real baseline and comment, daily)
    if: ${{ !startsWith(github.head_ref, 'dependabot/cargo/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The action's metadata, scripts and the workflows that use it
        run: |
          pip install shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25
          python3 -c "import yaml; a = yaml.safe_load(open('action.yml')); assert a['runs']['using'] == 'composite'"
          shellcheck action/*.sh install.sh scripts/release-wait*.sh
          actionlint
      - run: bash action/test.sh
      - run: bash scripts/release-wait.test.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo build -p sonde-cli && echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - uses: ./
        id: sonde
        with:
          version: path
          run: python3 -c 'print(1)'
          run-args: --url http://127.0.0.1:9 --path-style
          artifact: sonde-action-test
          comment: "false"
      - name: The action's outputs
        env:
          PASSED: ${{ steps.sonde.outputs.passed }}
          SESSION: ${{ steps.sonde.outputs.session }}
          REPORT: ${{ steps.sonde.outputs.report-url }}
        run: test "$PASSED" = true && test -f "$SESSION" && test -n "$REPORT"

  integration:
    if: ${{ !startsWith(github.head_ref, 'dependabot/cargo/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", workspaces: ". -> target\ntools/gen-slatedb -> target" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install "pyiceberg[sql-sqlite,pyarrow]==0.9.1"
      - run: scripts/integration.sh ceph rustfs
      - if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --tail 200

  record:
    # sonde run with four AWS SDKs against RustFS, and the proxy's overhead
    if: ${{ !startsWith(github.head_ref, 'dependabot/cargo/') }}
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: tools/sdk-smoke/go/go.mod, cache-dependency-path: tools/sdk-smoke/go/go.sum }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: pip install boto3
      - name: Start RustFS
        run: |
          docker compose -f tests/integration/docker-compose.yml --profile rustfs up -d rustfs
          until curl -s -o /dev/null -m 2 http://127.0.0.1:9100; do sleep 2; done
      - run: cargo build -p sonde-cli
      - name: Four SDKs through sonde run
        env: { SMOKE_SESSIONS: sessions }
        run: scripts/sdk-smoke.sh --url http://127.0.0.1:9100
      - name: Proxy overhead
        env: { OVERHEAD_URL: "http://127.0.0.1:9100", OVERHEAD_BUCKET: sonde-smoke }
        run: cargo run --release -p sonde-proxy --example overhead
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sdk-sessions, path: "sessions/*.sonde", if-no-files-found: ignore }

  ui:
    if: ${{ !startsWith(github.head_ref, 'dependabot/cargo/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", workspaces: ". -> target\napp/.nsh/rust -> ../../target" }
      - uses: ./.github/actions/nsh
        with: { rev: "${{ env.NSH_REV }}" }
      - run: scripts/ui-tests.sh

  shots:
    # the app on a real window — GTK under Xvfb, AppKit, Win32: every place,
    # wide and at the least size, light and dark, English and Chinese — kept
    # as an artifact, the visual record of each build. Linux on every change;
    # macOS and Windows on main's runs too (a release waits for them), the
    # nightly and by hand. The tour's variants run side by side (each one
    # job of Linux's, two of macOS's and Windows'), shots-check holds them.
    if: ${{ !startsWith(github.head_ref, 'dependabot/cargo/') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"os":"ubuntu-24.04","name":"linux","part":"wide","variants":"wide"},{"os":"ubuntu-24.04","name":"linux","part":"min","variants":"min"},{"os":"ubuntu-24.04","name":"linux","part":"dark","variants":"dark"},{"os":"ubuntu-24.04","name":"linux","part":"zh","variants":"zh"},{"os":"macos-15","name":"macos","part":"wide-min","variants":"wide,min"},{"os":"macos-15","name":"macos","part":"dark-zh","variants":"dark,zh"},{"os":"windows-latest","name":"windows","part":"wide-min","variants":"wide,min"},{"os":"windows-latest","name":"windows","part":"dark-zh","variants":"dark,zh"}]' || '[{"os":"ubuntu-24.04","name":"linux","part":"wide","variants":"wide"},{"os":"ubuntu-24.04","name":"linux","part":"min","variants":"min"},{"os":"ubuntu-24.04","name":"linux","part":"dark","variants":"dark"},{"os":"ubuntu-24.04","name":"linux","part":"zh","variants":"zh"}]') }}
    name: shots (${{ matrix.name }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}", key: "shots-${{ matrix.name }}", workspaces: "app/.nsh/rust -> ../../target" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang xvfb openbox fonts-noto-cjk
      - uses: ./.github/actions/nsh
        with: { rev: "${{ env.NSH_REV }}" }
      - name: Screenshots
        # the macOS runner's screen is 1024×768 (a menu bar above): a larger
        # window is cut off, and system_profiler does not say so there
        env:
          SONDE_SHOT_MAX: ${{ runner.os == 'macOS' && '1024x688' || '' }}
          SONDE_SHOT_VARIANTS: ${{ matrix.variants }}
        run: scripts/shots.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sonde-shots-${{ matrix.name }}-part-${{ matrix.part }}
          path: app/shots/*.png
          if-no-files-found: warn

  shots-check:
    # the tour gates a merge: a platform's pictures, its variants' together
    # (the sonde-shots-<platform> artifact), against the last green run of
    # this workflow on the default branch, in the job summary with
    # before | after | difference images; a screen that changed (past 0.5%
    # of its pixels, font smoothing aside) or is new must match the picture
    # approved for it in app/shots.approved.json, or the job fails. Approving
    # is committing that file (scripts/shots-diff.py approve, on this run's
    # sonde-shots-<platform> artifact). A platform with no approved pictures
    # is reported, not held. (A variant that failed has failed its own job.)
    needs: shots
    if: ${{ !cancelled() && needs.shots.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(github.event_name != 'pull_request' && '["linux","macos","windows"]' || '["linux"]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonde-shots-${{ matrix.name }}-part-*
          merge-multiple: true
          path: app/shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonde-shots-${{ matrix.name }}
          path: app/shots/*.png
          if-no-files-found: warn
      - name: Screens against the last green run, held to the approved ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots-before app/shots
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&branch=${{ github.event.repository.default_branch }}&per_page=1" --jq '.workflow_runs[0].id' || true)
          if [ -n "$prev" ]; then
            gh run download "$prev" -R "${{ github.repository }}" -n "sonde-shots-${{ matrix.name }}" -D shots-before || echo "no screenshots in run $prev: every screen is held to the approved ones"
          else
            echo "no green run to compare with: every screen is held to the approved ones"
          fi
          python3 -m venv "$RUNNER_TEMP/diff"
          "$RUNNER_TEMP/diff/bin/python" -m pip install -q pillow
          status=0
          "$RUNNER_TEMP/diff/bin/python" scripts/shots-diff.py shots-before app/shots shots-diff --approved app/shots.approved.json --platform ${{ matrix.name }} > shots-report.md || status=$?
          cat shots-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::error title=Screenshots::a screen changed and is not approved: see the job summary and the sonde-shots-diff-${{ matrix.name }} artifact; approve with scripts/shots-diff.py approve"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sonde-shots-diff-${{ matrix.name }}
          path: shots-diff/*.png
          if-no-files-found: ignore

  build:
    # a pull request: Linux x86_64; main, nightly and by hand: everything a
    # release ships (main's is the release's: a signature its macOS app
    # lacks is a warning)
    if: ${{ !startsWith(github.head_ref, 'dependabot/cargo/') }}
    uses: ./.github/workflows/build.yml
    with:
      set: ${{ github.event_name == 'pull_request' && 'pr' || 'all' }}
      release: ${{ github.event_name == 'push' }}
    secrets: inherit
