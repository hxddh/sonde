name: CI

# One run per change: a pull request's, then main's once merged. Main's
# run, the nightly (the schedule) and one by hand do everything: every build
# a release ships (release.yml publishes main's) and the tours of Linux,
# macOS and Windows. The nightly and one by hand also run what is too slow
# for every change (timed, ui-perf). A pull request's builds and tours Linux
# only; a Dependabot update's are a pull request's like any other.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# a newer push to a pull request cancels its run; main's runs all finish
# (a release takes its build from them)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: lint, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: ./.github/actions/nsh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p sonde-cli --features tui --all-targets -- -D warnings
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with: { tool: cargo-shear@1.14.1 }
      - name: No unused dependencies
        run: cargo shear
      - name: Session fixtures in the format sonde writes (scripts/fixtures.py)
        run: python3 scripts/fixtures.py --check
      - run: cd app && nsh check
      - name: Tables fit where they are shown; every word in every language
        run: python3 scripts/lint-layout.py && python3 scripts/lint-kit.py && python3 scripts/check-locales.py && python3 scripts/lint-charts.py
      - name: nsh build reports no warnings
        run: |
          set -o pipefail
          cd app && nsh build App.tsx 2>&1 | tee build.log
          ! grep -E "^warn" build.log

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # a test that hangs fails the job, not the hours after it
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # the debug build of the workspace: saved here, read by action and record
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: debug, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      # every member, the app's bridge (sonde-nsh) included
      - run: cargo test --workspace --locked

  budgets:
    # sessions of any size, held (optimised, as released): each test's
    # peak memory, the same from run to run, against its budget; its time,
    # which a shared runner moves, said and held only past several times
    # what it takes (crates/proxy/tests/budgets.rs, docs/dev/performance.md).
    # Each test is a process of its own, so its peak is its own. A job of
    # its own beside the unit tests: its release build and its sessions of
    # a million take longer than they do.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: release, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - name: Budgets of a large session
        # each session made once, by the first test that reads it
        env: { SONDE_BUDGET_SESSIONS: "${{ runner.temp }}/sessions" }
        run: |
          set -o pipefail
          # (listed first: a build that fails, or lists none, fails the step)
          tests=$(cargo test --release --locked -p sonde-proxy --test budgets -- --ignored --list --format terse | sed -n 's/: test$//p')
          [ -n "$tests" ] || { echo "::error title=Budgets::no budget test was listed"; exit 1; }
          for t in $tests; do
            cargo test --release --locked -p sonde-proxy --test budgets -- --ignored --nocapture --exact "$t" 2>&1 | tee -a budgets.log
          done
          { echo '```'; grep -h "^budget " budgets.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  timed:
    # too slow for every change: the timed tests #[ignore]d in a debug run.
    # A failure is a regression in speed, seen the next morning.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: release, save-if: false }
      # crates/proxy/tests/signals.rs: two seconds, optimised
      - name: The signals of a million requests
        run: cargo test --release --locked -p sonde-proxy --test signals -- --ignored --nocapture
      # crates/sonde-nsh/src/runs.rs: what a window asks for when it opens a
      # large run, a later page, and the size of what crosses to it
      - name: A million requests through the app's bridge
        run: |
          cargo run --release --locked -p sonde-proxy --example scale -- 1000000 "$RUNNER_TEMP/big.sonde"
          SONDE_BIG_RUN="$RUNNER_TEMP/big.sonde" cargo test --release --locked -p sonde-nsh --lib -- --ignored a_large_run --nocapture

  ui-perf:
    # app/tests/perf.test.tsx: 100,000 rows loaded and scrolled (its numbers
    # go to docs/dev/performance.md); the PERF line is in the job's summary
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: mkdir -p app/.nsh/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: app, save-if: false, workspaces: ". -> target\napp/.nsh/rust -> ../../target" }
      - uses: ./.github/actions/nsh
      - name: 100,000 rows
        run: |
          # (a failed test fails the step: the pipe hid it)
          set -o pipefail
          scripts/ui-tests.sh perf 2>&1 | tee perf.log
          grep -h "PERF " perf.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

  supply:
    # what sonde is built from: the licences, advisories and sources of its
    # crates, and the Java hook it injects, rebuilt from source byte for byte
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with: { tool: cargo-deny }
      - name: Licences, advisories, sources and bans (deny.toml)
        run: cargo deny --locked check
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "21" }
      - name: The committed callers hook is what hooks/java builds
        run: |
          sh hooks/java/build.sh
          git diff --exit-code --stat crates/proxy/src/hooks || {
            echo "::error title=Callers hook::crates/proxy/src/hooks/*.jar differ from what hooks/java/build.sh makes of hooks/java/src: run it and commit the jars"
            exit 1
          }

  action:
    # the GitHub Action (action.yml): its scripts linted and run against
    # stand-ins, then the action itself with this commit's sonde
    # (action-live.yml: against a real baseline and comment, daily)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The action's metadata, scripts and the workflows that use it
        run: |
          pip install -r .github/requirements.txt
          python3 -c "import yaml; a = yaml.safe_load(open('action.yml')); assert a['runs']['using'] == 'composite'"
          shellcheck action/*.sh install.sh scripts/release-wait*.sh
          actionlint
      - run: bash action/test.sh
      - run: bash scripts/release-wait.test.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: debug, save-if: false }
      - run: cargo build -p sonde-cli && echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - uses: ./
        id: sonde
        with:
          version: path
          run: python3 -c 'print(1)'
          run-args: --url http://127.0.0.1:9 --path-style
          artifact: sonde-action-test
          comment: "false"
      - name: The action's outputs
        env:
          PASSED: ${{ steps.sonde.outputs.passed }}
          SESSION: ${{ steps.sonde.outputs.file }}
          REPORT: ${{ steps.sonde.outputs.report-url }}
        run: test "$PASSED" = true && test -f "$SESSION" && test -n "$REPORT"

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: integration, save-if: "${{ github.ref == 'refs/heads/main' }}", workspaces: ". -> target\ntools/gen-slatedb -> target" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.14", cache: pip, cache-dependency-path: .github/requirements.txt }
      - run: pip install -r .github/requirements.txt
      - run: scripts/integration.sh ceph rustfs
      - if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --tail 200

  record:
    # sonde run with four AWS SDKs, the AWS CLI (the runner's v2, and its
    # image through `run -- docker run`), polars and one --tls pass against
    # RustFS, and the proxy's overhead
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: debug, save-if: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.14", cache: pip, cache-dependency-path: .github/requirements.txt }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: tools/sdk-smoke/go/go.mod, cache-dependency-path: tools/sdk-smoke/go/go.sum }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: pip install -r .github/requirements.txt
      - name: Start RustFS
        run: |
          docker compose -f tests/integration/docker-compose.yml --profile rustfs up -d rustfs
          until curl -s -o /dev/null -m 2 http://127.0.0.1:9100; do sleep 2; done
      - run: cargo build -p sonde-cli
      - name: The smoke programs through sonde run
        env: { SMOKE_SESSIONS: sessions }
        run: scripts/sdk-smoke.sh --url http://127.0.0.1:9100
      - name: Proxy overhead
        env: { OVERHEAD_URL: "http://127.0.0.1:9100", OVERHEAD_BUCKET: sonde-smoke }
        run: cargo run --release -p sonde-proxy --example overhead
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sdk-sessions, path: "sessions/*.sonde", if-no-files-found: ignore }

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # the app's crate (app/.nsh/rust) is written by nsh as it builds: made
      # first, so that the key is the same at every restore
      - run: mkdir -p app/.nsh/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: app, save-if: "${{ github.ref == 'refs/heads/main' }}", workspaces: ". -> target\napp/.nsh/rust -> ../../target" }
      - uses: ./.github/actions/nsh
      - run: scripts/ui-tests.sh

  shots:
    # the app on a real window — GTK under Xvfb, AppKit, Win32: every place,
    # wide and at the least size, light and dark, English and Chinese — kept
    # as an artifact, the visual record of each build. Linux on every change;
    # macOS and Windows on main's runs too (a release waits for them), the
    # nightly and by hand. The tour's variants run side by side (a job each
    # on Linux, two halves on macOS and Windows); shots-check holds them.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"os":"ubuntu-24.04","name":"linux","part":"wide","filter":"shots wide"},{"os":"ubuntu-24.04","name":"linux","part":"min","filter":"shots min"},{"os":"ubuntu-24.04","name":"linux","part":"dark","filter":"shots dark"},{"os":"ubuntu-24.04","name":"linux","part":"zh","filter":"shots zh"},{"os":"macos-15","name":"macos","part":"1","filter":"part 1"},{"os":"macos-15","name":"macos","part":"2","filter":"part 2"},{"os":"windows-latest","name":"windows","part":"1","filter":"part 1"},{"os":"windows-latest","name":"windows","part":"2","filter":"part 2"}]' || '[{"os":"ubuntu-24.04","name":"linux","part":"wide","filter":"shots wide"},{"os":"ubuntu-24.04","name":"linux","part":"min","filter":"shots min"},{"os":"ubuntu-24.04","name":"linux","part":"dark","filter":"shots dark"},{"os":"ubuntu-24.04","name":"linux","part":"zh","filter":"shots zh"}]') }}
    name: shots (${{ matrix.name }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # as ui keeps it; on Linux ui saves it, elsewhere the first part does
      - run: mkdir -p app/.nsh/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: app, save-if: "${{ github.ref == 'refs/heads/main' && matrix.part == '1' }}", workspaces: ". -> target\napp/.nsh/rust -> ../../target" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang xvfb openbox fonts-noto-cjk
      - uses: ./.github/actions/nsh
      - name: Screenshots
        # the macOS runner's screen is 1024×768 (a menu bar above): a larger
        # window is cut off, and system_profiler does not say so there
        env:
          SONDE_SHOT_MAX: ${{ runner.os == 'macOS' && '1024x688' || '' }}
          SHOTS_FILTER: ${{ matrix.filter }}
        run: scripts/shots.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sonde-shots-${{ matrix.name }}-part-${{ matrix.part }}
          path: app/shots/*.png
          if-no-files-found: warn

  shots-check:
    # the tour gates a merge: a platform's pictures, its variants' together
    # (the sonde-shots-<platform> artifact), against the last green run of
    # this workflow on the default branch, in the job summary with
    # before | after | difference images; a screen that changed (past 0.5%
    # of its pixels, font smoothing aside) or is new must match the picture
    # approved for it in app/shots.approved.json, or the job fails. Approving
    # is committing that file (scripts/shots-diff.py approve, on this run's
    # sonde-shots-<platform> artifact). A platform with no approved pictures
    # is reported, not held. (A variant that failed has failed its own job.)
    needs: shots
    if: ${{ !cancelled() && needs.shots.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(github.event_name != 'pull_request' && '["linux","macos","windows"]' || '["linux"]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonde-shots-${{ matrix.name }}-part-*
          merge-multiple: true
          path: app/shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonde-shots-${{ matrix.name }}
          path: app/shots/*.png
          if-no-files-found: warn
      - name: Screens against the last green run, held to the approved ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots-before app/shots
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&branch=${{ github.event.repository.default_branch }}&per_page=1" --jq '.workflow_runs[0].id' || true)
          if [ -n "$prev" ]; then
            gh run download "$prev" -R "${{ github.repository }}" -n "sonde-shots-${{ matrix.name }}" -D shots-before || echo "no screenshots in run $prev: every screen is held to the approved ones"
          else
            echo "no green run to compare with: every screen is held to the approved ones"
          fi
          python3 -m venv "$RUNNER_TEMP/diff"
          "$RUNNER_TEMP/diff/bin/python" -m pip install -q pillow
          status=0
          "$RUNNER_TEMP/diff/bin/python" scripts/shots-diff.py shots-before app/shots shots-diff --approved app/shots.approved.json --platform ${{ matrix.name }} > shots-report.md || status=$?
          cat shots-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::error title=Screenshots::a screen changed and is not approved: see the job summary and the sonde-shots-diff-${{ matrix.name }} artifact; approve with scripts/shots-diff.py approve"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sonde-shots-diff-${{ matrix.name }}
          path: shots-diff/*.png
          if-no-files-found: ignore

  build:
    # a pull request: Linux x86_64; main, nightly and by hand: everything a
    # release ships (main's is the release's: a signature its macOS app
    # lacks is a warning)
    uses: ./.github/workflows/build.yml
    with:
      set: ${{ github.event_name == 'pull_request' && 'pr' || 'all' }}
      release: ${{ github.event_name == 'push' }}
    # by name: only what signing needs (docs/dev/packaging.md)
    secrets:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
