[package]
name = "sonde-analysis"
description = "What a recorded run amounts to: its file, operations, findings, signals, profile and cost, a program over its runs, trials, replays and the report's data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sonde-proxy.workspace = true
sonde-fmt.workspace = true
s3raw.workspace = true
reqlog.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rand.workspace = true
flate2.workspace = true
base64.workspace = true
bytes.workspace = true
reqwest.workspace = true
http.workspace = true
percent-encoding.workspace = true
futures.workspace = true
parking_lot.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true
# Rust's parser, for the Rust fixes sonde prints (tests/fix_code.rs)
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
# the small S3 of the proxy's tests (tests/common, by #[path]), which the replay
# tests run against
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
