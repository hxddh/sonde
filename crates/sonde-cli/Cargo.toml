[package]
name = "sonde-cli"
description = "sonde: diagnose S3 and S3-compatible object storage. Headless subcommands for scripts and CI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sonde"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sonde-fmt.workspace = true
sonde-core.workspace = true
probes.workspace = true
decoders.workspace = true
s3raw.workspace = true
http.workspace = true
reqlog.workspace = true
sonde-proxy.workspace = true
sonde-analysis.workspace = true
bytes.workspace = true
tempfile.workspace = true
futures.workspace = true
reqwest.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["full"] }
anyhow.workspace = true

[target.'cfg(unix)'.dependencies]
# a run's process group is ended whole (`sonde run`, interrupted)
rustix = { version = "1", features = ["process", "termios"] }

[dev-dependencies]
flate2.workspace = true
# the small S3 of the proxy's tests (tests/common, by #[path]), which the trial
# tests run sonde against
parking_lot.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
