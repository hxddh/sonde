[package]
name = "sonde-cli"
description = "sonde: diagnose S3 and S3-compatible object storage. Headless subcommands for scripts and CI, and the terminal UI."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sonde"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# The terminal UI (`sonde tui`): links Native Shell's terminal backend.
tui = ["dep:sonde-nsh", "dep:nsh-platform-tui", "dep:nsh-tui-host", "dep:nsh-engine", "dep:nsh-base", "dep:nsh-core", "dep:nsh-package", "dep:ratatui-core", "dep:ratatui-crossterm", "dep:crossterm", "dep:base64"]

[dependencies]
sonde-core.workspace = true
probes.workspace = true
decoders.workspace = true
s3raw.workspace = true
reqlog.workspace = true
sonde-nsh = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["full"] }
anyhow.workspace = true
nsh-platform-tui = { workspace = true, optional = true, features = ["js", "run-app"] }
nsh-tui-host = { git = "https://github.com/longbridge/nsh", rev = "9d12096878bb08bce28e2e72d0356c75e11244ed", optional = true }
nsh-engine = { workspace = true, optional = true, features = ["js-core"] }
nsh-base = { workspace = true, optional = true }
nsh-core = { workspace = true, optional = true }
nsh-package = { workspace = true, optional = true }
ratatui-core = { version = "0.1.2", optional = true }
ratatui-crossterm = { version = "0.1.2", optional = true }
crossterm = { version = "0.29.0", optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
